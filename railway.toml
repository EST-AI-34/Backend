[build]
builder = "DOCKERFILE"

[deploy]
preDeployCommand = "python -m scripts.migrate"
startCommand = "sh -c 'uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000} --workers 1'"
# DB 연결까지 확인한다. /health/live는 기동 실패와 DB 문제를 분리해 보려고 임시로 쓰던 값인데
# 그대로 남아 있어서, DB가 끊겨도 배포가 healthy로 보고됐다.
healthcheckPath = "/health/ready"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
