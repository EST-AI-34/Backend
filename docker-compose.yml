services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: festival
      POSTGRES_USER: festival
      POSTGRES_PASSWORD: festival
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U festival"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - festival_pg:/var/lib/postgresql/data

volumes:
  festival_pg:
